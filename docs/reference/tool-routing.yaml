version: 9
scope: main-local
policy: flow_first_explicit_model_route
runtime:
  daily_entry: /flow
  source: global_aos_package
  requirement: aos.requirements.json
  local_flow_copy: forbidden
flow:
  phases: [Pensar, Planear, Hacer, Cerrar]
  execution:
    mode: direct_in_replacement_parent
    handoff: new_linked_session_documentary_reviewable
    auto_send: false
    agent_use: explicit_user_request_only
    writer_count: 1
    max_batches: 1
    model_routing:
      source: selected_plan_frontmatter
      field: execution_route
      default: balanced
      economical: openai-codex/gpt-5.6-luna@high
      balanced: openai-codex/gpt-5.6-sol@medium
      strong: openai-codex/gpt-5.6-sol@high
      semantics:
        economical: explicit_quota_saving_with_deterministic_checks
        balanced: normal_time_first_default_for_bounded_work
        strong: exceptional_ambiguity_or_hard_to_detect_material_failure
      non_escalators:
        - priority
        - file_count
        - native_stack
        - contract_or_review
        - complex_planning
        - authorized_external_effect
      manual_controls:
        ctrl_p: toggle_sol_medium_high
        ctrl_l: model_selector
      application: replacement_session_reload_before_handoff
      visibility: prompt_and_notification
      unavailable: fail_closed_without_fallback
      classifier: none
      terra: excluded_until_local_evidence
local_gates: [desktop_automation, hotkeys, clipboard, accounts, private_data, install, commit, push, deploy]
removed_engines: { taskflow: removed, council: removed, planner: removed, until_done: removed, dgoal: removed }
invariants:
  - execution_route_is_explicit_reviewable_and_session_scoped
  - prompts_are_reviewable_and_not_auto_sent
  - no_runtime_state
  - no_parallel_writers
  - desktop_side_effects_keep_explicit_gates
