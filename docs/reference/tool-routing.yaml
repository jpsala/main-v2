version: 14
scope: main-local
policy: traycer_native_intent_first

runtime:
  control_plane: traycer
  harness: codex
  fallback_harness: omp
  fallback_mode: manual_only
  pi_usage:
    - product_runtime
    - harness_lab
  daily_entry: conversation
  package_extension: none
  prompts: none
  manager_skills_autoload: false

intent:
  discuss:
    action: current_thread_no_edit
  plan:
    action: proportional_brief_no_execution
  implement:
    action: current_session_direct
    preserve_existing_changes: true
    verify_observable_result: true
  persist:
    action: concise_durable_state_only

execution:
  default_model: gpt-5.6-sol
  default_thinking: medium
  high_only_for:
    - material_ambiguity
    - open_architecture
    - security_or_privacy
    - irreversible_change
    - production_or_high_impact
  automatic_fallback: false
  automatic_new_session: false
  automatic_send: false

coordination:
  todos: multi_step_work
  agents: explicit_user_request_only
  parallelism: independent_slices_only
  main_thread_verifies_results: true

inspection: minimum_needed_to_preserve_existing_changes
implementation: direct_observable_outcome
checks: minimum_sufficient_nonduplicated_checks
documentation: concise_final_state_only
scope_growth: stop_and_report

approval:
  mode: single_batch_envelope
  local_reversible: proceed
  require_for:
    - desktop_automation
    - hotkeys_or_clipboard
    - accounts_or_private_data
    - installs
    - credentials
    - destructive_actions
    - commit_or_push
    - deploy_or_production
    - external_side_effects
  reopen_only_for: material_environment_audience_cost_destruction_access_or_evidence_change

product_integrations:
  product_pi_launcher: external_desktop_integration
  agent_runtime: false
  ahk_entrypoints:
    - RunPiMenuPreset
    - ShowPiMenuHelp
  catalog:
    - menu-actions.ahk
    - menus.ahk
  preserve_presets_and_labels: true
